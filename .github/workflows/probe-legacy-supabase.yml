name: Read-only legacy Lovable database availability

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-legacy-supabase.yml"]

permissions:
  contents: read

jobs:
  check-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe original Supabase using its existing public key
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines=fs.readFileSync('.env','utf8').split(/\r?\n/);
          const env=Object.fromEntries(lines.filter(s=>s.includes('=') && !s.trim().startsWith('#')).map(s=>{const i=s.indexOf('=');return [s.slice(0,i).trim(),s.slice(i+1).trim().replace(/^['"]|['"]$/g,'')]}));
          const url=env.SUPABASE_URL;
          const key=env.SUPABASE_PUBLISHABLE_KEY;
          if (!url?.includes('odffncndlkefmachacps') || !key) throw Error('Legacy public config does not match');
          try {
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),15000);
            const response=await fetch(url+'/rest/v1/vehicles?select=id&status=eq.ativo&limit=1',{
              headers:{apikey:key,Accept:'application/json',Prefer:'count=exact'},
              signal:controller.signal
            });
            clearTimeout(timer);
            console.log('Legacy API status:',response.status);
            console.log('Legacy public vehicle count header:',response.headers.get('content-range')||'unavailable');
            console.log('Legacy response type:',response.headers.get('content-type')||'unavailable');
            if (!response.ok) console.log('Legacy database cannot currently be read using its public credential.');
          } catch (error) {
            console.log('Legacy API is not reachable:',error.name);
          }
          NODE
