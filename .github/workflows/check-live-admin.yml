name: Verify live username-only admin deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-live-admin.yml"
      - "public/login-deploy-check.txt"
      - "src/routes/admin.index.tsx"
      - "src/lib/admin-login.ts"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production alias serves this release (no passwords)
        run: |
          node --input-type=module <<'NODE'
          const stable = "https://jonathanveiculos.vercel.app";
          const expected = "username-only-20261025-v2";
          let found = false;

          // Vercel's Git deployment and production alias assignment are asynchronous.
          for (let attempt = 1; attempt <= 15; attempt++) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
              const response = await fetch(stable + "/login-deploy-check.txt?v=" + Date.now(), {
                signal: controller.signal,
                redirect: "follow",
                headers: { "Cache-Control": "no-cache" }
              });
              const body = await response.text();
              console.log("Production marker", JSON.stringify({
                attempt, status: response.status,
                correctVersion: body.includes(expected), length: body.length
              }));
              if (response.ok && body.includes(expected)) {
                found = true;
                break;
              }
            } catch (error) {
              console.log("Production request failed", error.name);
            } finally {
              clearTimeout(timeout);
            }
            await new Promise(resolve => setTimeout(resolve, 4000));
          }

          if (!found) {
            throw Error("The stable domain does not serve the latest username-only release.");
          }

          const login = await fetch(stable + "/admin/?v=" + Date.now(), {
            redirect: "follow",
            headers: { "Cache-Control": "no-cache" }
          });
          console.log("Production login route", JSON.stringify({
            status: login.status, contentType:login.headers.get("content-type"),
            finalUrl: login.url
          }));
          if (!login.ok || !login.headers.get("content-type")?.includes("text/html")) {
            throw Error("Production login route is not available");
          }
          console.log("Production alias and username-only release confirmed.");
          NODE
