name: Smoke-test published images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-test-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hero and header logo are served as real images
        run: |
          set -euo pipefail
          check_image() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local file="/tmp/${label}"
            echo "Checking ${label}: ${url}"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --max-time 30 --output "$file" "$url"
            local actual
            actual=$(file --brief --mime-type "$file")
            echo "${label}: ${actual}; size $(wc -c < "$file") bytes"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Wrong content type for ${label} (expected ${expected}, got ${actual})"
              exit 1
            fi
          }
          check_image logo "https://jonathanveiculos.vercel.app/__l5e/assets-v1/828de237-9cee-4ee6-8361-8485755b21ea/logo-crest.png" image/png
          check_image hero "https://jonathanveiculos.vercel.app/__l5e/assets-v1/7187229c-214a-4a66-943f-86d18cdffde5/store-hero.webp" image/webp
          echo "Both production images are publicly accessible."
