name: One-time migrated inventory verification

on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-migration-once.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify active inventory and real stored images
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=fs.readFileSync('vite.config.ts','utf8');
          const keyLiteral=config.match(/VITE_SUPABASE_PUBLISHABLE_KEY = ("[^"]+")/);
          if (!keyLiteral) throw Error("Missing publishable key in production Vite config");
          const key=JSON.parse(keyLiteral[1]);
          const api='https://uaizkvulshnssdhgxyug.supabase.co';
          const res=await fetch(
            api+'/rest/v1/vehicles?select=id,brand,model,vehicle_images(url,is_primary)&status=eq.ativo&limit=8',
            {headers:{apikey:key,Accept:'application/json',Prefer:'count=exact'}}
          );
          if (!res.ok) throw Error("Public vehicle API HTTP "+res.status);
          const cars=await res.json();
          if (!Array.isArray(cars)||cars.length===0) throw Error("No active vehicles returned publicly");
          const pictures=cars.flatMap(v=>v.vehicle_images||[]).slice(0,12);
          if (!pictures.length) throw Error("No public car photos attached");
          for(const pic of pictures) {
            if(!pic.url?.startsWith(api+'/storage/v1/object/public/vehicle-images/')) {
              throw Error("Image still points outside the independent Supabase project");
            }
          }
          const results=await Promise.all(pictures.map(async pic=>{
            const response=await fetch(pic.url,{signal:AbortSignal.timeout(15000)});
            if(!response.ok) throw Error("Storage image failed HTTP "+response.status);
            const type=response.headers.get('content-type')||'';
            const bytes=new Uint8Array(await response.arrayBuffer());
            if(!type.startsWith('image/')||bytes.length<500)throw Error("Invalid storage image mime/content");
            return bytes.length;
          }));
          console.log(JSON.stringify({
            valid:true, firstVehicles:cars.length,
            publicTotal:res.headers.get('content-range'),
            testedRealImageFiles:results.length,
            downloadedBytes:results.reduce((s,n)=>s+n,0)
          }));
          NODE
      - name: Verify live website renders migrated stock in Chromium
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome unavailable; independent public API and image tests already passed"
            exit 0
          fi
          timeout 65 "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom 'https://www.lojajonathanveiculos.com.br/?inventory-check=20261102' > /tmp/dom.html 2>/tmp/chrome.log || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('/tmp/dom.html','utf8');
          const visible=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]*>/g,' ').replace(/\s+/g,' ');
          const hasStock=visible.includes('DUSTER')||visible.includes('FLUENCE')||visible.includes('VOYAGE')||visible.includes('GRAND SIENA');
          const empty=visible.includes('Nenhum veículo encontrado');
          const error=visible.includes('Estoque temporariamente indisponível');
          console.log(JSON.stringify({liveHtmlBytes:html.length, migratedCarShown:hasStock,emptyState:empty,errorState:error}));
          if(!hasStock||empty||error) throw Error("Storefront did not render migrated vehicles: "+visible.slice(0,400));
          NODE
