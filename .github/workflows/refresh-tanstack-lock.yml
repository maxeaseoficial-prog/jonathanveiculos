name: Regenerate patched TanStack lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Resolve and regenerate lockfile
        run: bun install
      - name: Verify patched TanStack versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = fs.readFileSync('bun.lock', 'utf8');
          const required = {
            '@tanstack/react-start': '1.168.60',
            '@tanstack/start-server-core': '1.169.39',
          };
          for (const [name, version] of Object.entries(required)) {
            if (!lock.includes(JSON.stringify(name) + ': [' + JSON.stringify(name + '@' + version))) {
              throw new Error('Missing patched dependency: ' + name + '@' + version);
            }
          }
          console.log('TanStack patched versions verified.');
          NODE
      - name: Verify Vercel build
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          CI: "true"
        run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patched-bun-lock
          path: bun.lock
          retention-days: 2

  commit-lock:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: patched-bun-lock
          path: .
      - name: Commit regenerated lockfile
        run: |
          git add bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deps): lock patched TanStack Start dependencies"
            git push origin HEAD:main
          fi
